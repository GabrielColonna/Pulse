name: Pulse
options:
  bundleIdPrefix: com.gabrielcolonna
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  SWIFT_VERSION: "5.9"
packages:
  CoreXLSX:
    url: https://github.com/CoreOffice/CoreXLSX.git
    from: 0.14.2
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19
targets:
  Pulse:
    type: application
    platform: iOS
    sources:
      - Pulse
    resources:
      - Pulse/Resources/Assets.xcassets
      - Pulse/Resources/Fonts
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.gabrielcolonna.pulse
      INFOPLIST_FILE: Pulse/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: CoreXLSX
      - package: ZIPFoundation
  PulseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PulseTests
    dependencies:
      - target: Pulse
    settings:
      GENERATE_INFOPLIST_FILE: YES
  PulseUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - PulseUITests
    dependencies:
      - target: Pulse
    settings:
      GENERATE_INFOPLIST_FILE: YES
      TEST_TARGET_NAME: Pulse
schemes:
  Pulse:
    build:
      targets:
        Pulse: all
        PulseTests: [test]
        PulseUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - PulseTests
        - PulseUITests
